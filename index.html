<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="Game.js"></script>
    
        <div class="game-container">

  <div class="player">
    <div class="player-title">Human</div>

    <div class="choices human-choices">
      <button class="choice human-choice" data-choice="rock">Rock</button>
      <button class="choice human-choice" data-choice="paper">Paper</button>
      <button class="choice human-choice" data-choice="scissors">Scissors</button>
    </div>
  </div>

  <div class="player">
    <div class="player-title">Computer</div>

    <div class="choices computer-choices">
      <button class="choice computer-choice" data-choice="rock">Rock</button>
      <button class="choice computer-choice" data-choice="paper">Paper</button>
      <button class="choice computer-choice" data-choice="scissors">Scissors</button>
    </div>
  </div>

</div>
    
    

</body>
</html>
